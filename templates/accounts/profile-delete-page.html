{% extends 'base.html' %}
{% load static %}
{% block content %}

<div class="edit-delete">
    <h2>Delete Profile</h2>
    <p>Are you sure you want to delete your profile? All your pets, photos, likes and comments will be removed.</p>

    <form method="post" action="{% url 'profile-delete' request.user.pk %}">
        {% csrf_token %}

        <div class="sure-buttons">
            <button class="delete-btn" type="submit">Yes</button>

            <a class="edit-btn" href="javascript:history.back()">Go Back</a>
        </div>
    </form>
</div>

{% endblock %}
