{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petstagram</title>

    <!-- Stylesheets -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
    <link rel="icon" type="image/x-icon" href="{% static 'images/free-30-instagram-stories-icons23_122570.png' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <!-- Header / Navigation -->
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">

                    <!-- Home Page Link -->
                    <a href="{% url 'home' %}">
                        <img width="50px" src="{% static 'images/free-30-instagram-stories-icons23_122570.png' %}" alt="img1">
                    </a>

                    <!-- Home Title -->
                    <a class="home" href="{% url 'home' %}">
                        <i>Petstagram</i>
                    </a>
                </div>

                <div class="nav-links">
                    <ul class="nav-group">

                        <!-- Add Pet -->
                        <li class="nav-item">
                            <a href="{% url 'pet-add' %}">
                                <i>Add Pet</i>
                            </a>
                        </li>

                        <!-- Add Photo -->
                        <li class="nav-item">
                            <a href="{% url 'photo-add' %}">
                                <i>Add Photo</i>
                            </a>
                        </li>

                        {% if request.user.is_authenticated %}
                            <!-- Profile -->
                            <li class="nav-item">
                                <a href="{% url 'profile-details' request.user.pk %}">
                                    <i>Profile</i>
                                </a>
                            </li>

                            <!-- Logout Button -->
                            <li class="nav-item">
                                <form method="post" action="{% url 'logout' %}">
                                    {% csrf_token %}
                                    <button class="button" type="submit">
                                        <i>Logout</i>
                                    </button>
                                </form>
                            </li>

                        {% else %}
                            <!-- Login -->
                            <li class="nav-item">
                                <a href="{% url 'login' %}">
                                    <i>Login</i>
                                </a>
                            </li>

                            <!-- Register -->
                            <li class="nav-item">
                                <a href="{% url 'register' %}">
                                    <i>Register</i>
                                </a>
                            </li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Main content block -->
    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer">
        <span class="footer-section">
            © 2024 SOFTUNI WORKSHOP FOR PYTHON WEB MODULE
        </span>
    </footer>

</body>

</html>
